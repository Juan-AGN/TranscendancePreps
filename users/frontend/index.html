<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcendence</title>
  </head>
  <body>
    <!--
      Este div es donde React "monta" toda la aplicación.
      React toma este div vacío y lo rellena con todos los componentes.
      Es el único HTML real que hay: todo lo demás lo genera React.
    -->
    <div id="root"></div>

    <!--
      Punto de entrada de React. Vite carga este archivo TypeScript
      que a su vez carga todos los componentes.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
