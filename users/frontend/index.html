<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcendence</title>
  </head>
  <body>
    <!--
      This div is where React "mounts" the entire application.
      React takes this empty div and fills it with all the components.
      It is the only real HTML here: everything else is generated by React.
    -->
    <div id="root"></div>

    <!--
      React entry point. Vite loads this TypeScript file
      which in turn loads all the components.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
