<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcendence - Usuarios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        
        h2 {
            margin-top: 0;
            font-size: 1.3em;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        #resultado {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            min-height: 50px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .status.ok {
            background: rgba(46, 204, 113, 0.3);
        }
        
        .status.error {
            background: rgba(231, 76, 60, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Transcendence - Gestión de Usuarios</h1>
        
        <div id="status" class="status">Verificando conexión...</div>
        
        <!-- SECCIÓN: REGISTRO -->
        <div class="section">
            <h2> Registrar Usuario</h2>
            <input type="text" id="nombre" placeholder="Nombre">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="registrarUsuario()">Registrar</button>
        </div>
        
        <!-- SECCIÓN: OBTENER USUARIOS -->
        <div class="section">
            <h2> Lista de Usuarios</h2>
            <button onclick="obtenerUsuarios()">Obtener Usuarios</button>
            <div id="resultado"></div>
        </div>
    </div>

    <script>
        // Verificar conexión al cargar la página
        window.onload = verificarConexion;
        
        async function verificarConexion() {
            try {
                const response = await fetch('/get_usuarios');
                if (response.ok) {
                    mostrarStatus(' Backend conectado', 'ok');
                } else {
                    mostrarStatus(' Backend respondió con error', 'error');
                }
            } catch (error) {
                mostrarStatus(' No se puede conectar al backend', 'error');
            }
        }
        
        function mostrarStatus(mensaje, tipo) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = mensaje;
            statusDiv.className = `status ${tipo}`;
        }
        
        async function registrarUsuario() {
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!nombre || !email || !password) {
                alert('Por favor, rellena todos los campos');
                return;
            }
            
            try {
                const response = await fetch('/registro', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ nombre, email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert(' Usuario registrado exitosamente');
                    document.getElementById('nombre').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';
                    obtenerUsuarios(); // Actualizar lista
                } else {
                    alert(' Error: ' + (data.error || 'Error desconocido'));
                }
            } catch (error) {
                alert(' Error de conexión: ' + error.message);
            }
        }
        
        async function obtenerUsuarios() {
            try {
                const response = await fetch('/get_usuarios');
                const data = await response.json();
                
                const resultadoDiv = document.getElementById('resultado');
                
                if (data.length === 0) {
                    resultadoDiv.textContent = 'No hay usuarios registrados';
                } else {
                    resultadoDiv.textContent = JSON.stringify(data, null, 2);
                }
            } catch (error) {
                document.getElementById('resultado').textContent = 
                    ' Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
