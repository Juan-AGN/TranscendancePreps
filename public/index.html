<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Transcendence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        h2 {
            color: #764ba2;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-weight: 500;
        }
        
        .alert-error {
            background-color: #fee;
            border: 2px solid #fcc;
            color: #c33;
        }
        
        .alert-success {
            background-color: #efe;
            border: 2px solid #cfc;
            color: #3c3;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .usuarios-list {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .usuario-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .usuario-item strong {
            color: #667eea;
        }
        
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Gestión de Usuarios</h1>
        
        <div id="alertContainer"></div>
        
        <!-- ============================================ -->
        <!-- SECCION: REGISTRAR NUEVO USUARIO -->
        <!-- ============================================ -->
        <h2>📝 Registrar Nuevo Usuario</h2>
        <div class="form-group">
            <input type="text" id="registroNombre" placeholder="Nombre completo" value="Daniel Test">
        </div>
        <div class="form-group">
            <input type="email" id="registroEmail" placeholder="Email" value="daniel@test.com">
        </div>
        <div class="form-group">
            <input type="password" id="registroPassword" placeholder="Contraseña" value="MiPassword123">
        </div>
        <button onclick="registrarUsuario()">Registrar Usuario</button>
        
        <!-- ============================================ -->
        <!-- SECCION: LOGIN -->
        <!-- ============================================ -->
        <h2> Iniciar Sesión</h2>
        <div class="form-group">
            <input type="email" id="loginEmail" placeholder="Email" value="daniel@test.com">
        </div>
        <div class="form-group">
            <input type="password" id="loginPassword" placeholder="Contraseña" value="MiPassword123">
        </div>
        <button onclick="loginUsuario()">Iniciar Sesión</button>
        
        <!-- ============================================ -->
        <!-- ← NUEVO: SECCION SUBIR AVATAR -->
        <!-- ============================================ -->
        <h2>🖼️ Subir Avatar</h2>
        <div class="form-group">
            <input type="number" id="avatarUserId" placeholder="ID del usuario" value="1" min="1">
        </div>
        <div class="form-group">
            <input type="file" id="avatarFile" accept="image/*" onchange="previsualizarAvatar()">
        </div>
        <img id="avatarPreview" class="avatar-preview" style="display:none;" />
        <button onclick="subirAvatar()">Subir Avatar</button>
        

        <!-- ============================================ -->
        <!-- SECCION: LISTA DE USUARIOS REGISTRADOS -->
        <!-- ============================================ -->
        <h2> Lista de Usuarios Registrados</h2>
        <button onclick="obtenerUsuarios()">Obtener Usuarios</button>
        <div id="usuariosList"></div>
        
        <!-- ============================================ -->
        <!-- SECCION: RESPUESTA DEL SERVIDOR -->
        <!-- ============================================ -->
        <h2> Respuesta del Servidor</h2>
        <pre id="respuesta">Esperando acción...</pre>
    </div>

    <script>
        // ====================================================================
        // CONFIGURACION: URL del backend
        // ====================================================================
        const API_URL = 'http://localhost:3000';
        
        // ====================================================================
        // FUNCION: Mostrar alertas (éxito o error)
        // ====================================================================
        function mostrarAlerta(mensaje, tipo = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            const alertClass = tipo === 'success' ? 'alert-success' : 'alert-error';
            
            alertContainer.innerHTML = `
                <div class="alert ${alertClass}">
                    ${tipo === 'success' ? '✅' : '❌'} ${mensaje}
                </div>
            `;
            
            // Auto-ocultar después de 5 segundos
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }
        
        // ====================================================================
        // FUNCION: Mostrar respuesta del servidor en formato JSON
        // ====================================================================
        function mostrarRespuesta(data) {
            const respuestaElement = document.getElementById('respuesta');
            respuestaElement.textContent = JSON.stringify(data, null, 2);
        }
        
        // ====================================================================
        // FUNCION 1: REGISTRAR NUEVO USUARIO
        // ====================================================================
        async function registrarUsuario() {
            // PASO 1: Obtener los valores de los inputs
            const nombre = document.getElementById('registroNombre').value;
            const email = document.getElementById('registroEmail').value;
            const contraseña = document.getElementById('registroPassword').value;
            
            // PASO 2: Validar que todos los campos estén llenos
            if (!nombre || !email || !contraseña) {
                mostrarAlerta('Por favor, rellena todos los campos', 'error');
                return;
            }
            
            try {
                // PASO 3: Hacer la petición POST al backend
                // RUTA CORRECTA: /usuarios/registro (CON /usuarios/)
                const response = await fetch(`${API_URL}/usuarios/registro`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        email: email,
                        contraseña: contraseña
                    })
                });
                
                // PASO 4: Parsear la respuesta JSON
                const data = await response.json();
                
                // PASO 5: Mostrar la respuesta en pantalla
                mostrarRespuesta(data);
                
                // PASO 6: Mostrar alerta según el resultado
                if (response.ok) {
                    mostrarAlerta('Usuario registrado exitosamente', 'success');
                    // Limpiar los campos
                    document.getElementById('registroNombre').value = '';
                    document.getElementById('registroEmail').value = '';
                    document.getElementById('registroPassword').value = '';
                } else {
                    mostrarAlerta(data.error || 'Error al registrar usuario', 'error');
                }
                
            } catch (error) {
                // PASO 7: Manejar errores de red
                console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor', 'error');
                mostrarRespuesta({ error: 'Error de conexión: ' + error.message });
            }
        }
        
        // ====================================================================
        // FUNCION 2: LOGIN (INICIAR SESION)
        // ====================================================================
        async function loginUsuario() {
            // PASO 1: Obtener los valores de los inputs
            const email = document.getElementById('loginEmail').value;
            const contraseña = document.getElementById('loginPassword').value;
            
            // PASO 2: Validar que todos los campos estén llenos
            if (!email || !contraseña) {
                mostrarAlerta('Por favor, rellena email y contraseña', 'error');
                return;
            }
            
            try {
                // PASO 3: Hacer la petición POST al backend
                // RUTA CORRECTA: /usuarios/login (CON /usuarios/)
                const response = await fetch(`${API_URL}/usuarios/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        contraseña: contraseña
                    })
                });
                
                // PASO 4: Parsear la respuesta JSON
                const data = await response.json();
                
                // PASO 5: Mostrar la respuesta en pantalla
                mostrarRespuesta(data);
                
                // PASO 6: Mostrar alerta según el resultado
                if (response.ok) {
                    mostrarAlerta('Login exitoso. Token guardado', 'success');
                    // Guardar el token en localStorage
                    localStorage.setItem('token', data.token);
                } else {
                    mostrarAlerta(data.error || 'Email o contraseña incorrectos', 'error');
                }
                
            } catch (error) {
                // PASO 7: Manejar errores de red
                console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor', 'error');
                mostrarRespuesta({ error: 'Error de conexión: ' + error.message });
            }
        }

        // ====================================================================
        // ← NUEVO: FUNCION 3: PREVISUALIZAR AVATAR
        // ====================================================================
        function previsualizarAvatar() {
            const fileInput = document.getElementById('avatarFile');
            const preview = document.getElementById('avatarPreview');
            const file = fileInput.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
            }
        }

        // ====================================================================
        // ← NUEVO: FUNCION 4: SUBIR AVATAR
        // ====================================================================
        async function subirAvatar() {
            const userId = document.getElementById('avatarUserId').value;
            const fileInput = document.getElementById('avatarFile');
            const file = fileInput.files[0];
            
            if (!file) {
                mostrarAlerta('Por favor, selecciona una imagen', 'error');
                return;
            }
            
            if (!userId) {
                mostrarAlerta('Por favor, ingresa el ID del usuario', 'error');
                return;
            }
            
            // Obtener el token del localStorage
            const token = localStorage.getItem('token');
            
            if (!token) {
                mostrarAlerta('Debes iniciar sesión primero', 'error');
                return;
            }
            
            try {
                // Crear FormData para enviar el archivo
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch(`${API_URL}/usuarios/${userId}/avatar`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                const data = await response.json();
                mostrarRespuesta(data);
                
                if (response.ok) {
                    mostrarAlerta('Avatar subido correctamente', 'success');
                    // Limpiar el input y preview
                    fileInput.value = '';
                    document.getElementById('avatarPreview').style.display = 'none';
                    // Actualizar la lista de usuarios
                    obtenerUsuarios();
                } else {
                    mostrarAlerta(data.error || 'Error al subir avatar', 'error');
                }
                
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor', 'error');
                mostrarRespuesta({ error: 'Error de conexión: ' + error.message });
            }
        }
        
        // ====================================================================
        // FUNCION 5: OBTENER LISTA DE USUARIOS
        // ====================================================================
        async function obtenerUsuarios() {
            try {
                // Mostrar indicador de carga
                const usuariosList = document.getElementById('usuariosList');
                usuariosList.innerHTML = '<div class="loading"> Cargando usuarios...</div>';
                
                // PASO 1: Hacer la petición GET al backend
                // RUTA CORRECTA: /usuarios (CON /usuarios/)
                const response = await fetch(`${API_URL}/usuarios`);
                
                // PASO 2: Parsear la respuesta JSON
                const data = await response.json();
                
                // PASO 3: Mostrar la respuesta en formato JSON
                mostrarRespuesta(data);
                
                // PASO 4: Renderizar la lista de usuarios
                if (response.ok && data.usuarios && data.usuarios.length > 0) {
                    usuariosList.innerHTML = '<div class="usuarios-list">';
                    
                    data.usuarios.forEach(usuario => {
                        usuariosList.innerHTML += `
                            <div class="usuario-item">
                                <strong>ID:</strong> ${usuario.id}<br>
                                <strong>Nombre:</strong> ${usuario.nombre}<br>
                                <strong>Email:</strong> ${usuario.email}<br>
                                <strong>Fecha:</strong> ${new Date(usuario.createdAt).toLocaleString('es-ES')}
                            </div>
                        `;
                    });
                    
                    usuariosList.innerHTML += '</div>';
                    mostrarAlerta(`Se encontraron ${data.total} usuarios`, 'success');
                    
                } else if (response.ok && data.total === 0) {
                    usuariosList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No hay usuarios registrados</p>';
                    mostrarAlerta('No hay usuarios en la base de datos', 'error');
                } else {
                    usuariosList.innerHTML = '';
                    mostrarAlerta('Error al obtener usuarios', 'error');
                }
                
            } catch (error) {
                // PASO 5: Manejar errores de red
                console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor', 'error');
                mostrarRespuesta({ error: 'Error de conexión: ' + error.message });
                document.getElementById('usuariosList').innerHTML = '';
            }
        }
        
        // ====================================================================
        // INICIALIZACION: Cargar usuarios al cargar la página
        // ====================================================================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Frontend inicializado');
            console.log('API URL:', API_URL);
            
            // Cargar usuarios automáticamente
            obtenerUsuarios();
        });
    </script>
</body>
</html>
