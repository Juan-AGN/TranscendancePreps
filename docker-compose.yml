services:
  game-back:
    container_name: game-back
    build:
      context: ./game/back
    env_file:
      - .env.scoreback
    networks:
      - game_network
    ports:
      - "8888:8888"

  game-front:
    container_name: game-front
    build:
      context: ./game/front
    networks:
      - game_network
      - auth_network
    ports:
      - "7777:3000"

networks:
  game_network:
    name: game_network
    driver: bridge
