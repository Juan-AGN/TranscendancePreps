# ============================================================================
# DOCKER COMPOSE - CONFIGURACIÓN COMPLETA
# ============================================================================
# Este archivo define todos los contenedores (servicios) del proyecto

# ============================================================================
# SERVICIOS (CONTENEDORES)
# ============================================================================
services:

  # ==========================================================================
  # CONTENEDOR 1: BASE DE DATOS (PostgreSQL)
  # ==========================================================================
  db:
    image: postgres:16-alpine
    container_name: transcendence_db
    restart: always
    environment:
      POSTGRES_USER: transcendence_user
      POSTGRES_PASSWORD: transcendence_pass
      POSTGRES_DB: transcendence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence_user -d transcendence"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================================================
  # CONTENEDOR 2: BACKEND (Fastify + Prisma + TypeScript)
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcendence_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://transcendence_user:transcendence_pass@db:5432/transcendence"
      JWT_SECRET: "clave_super_secreta_cambiar_en_produccion"
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      # Solo persistir avatares y prisma, no sobreescribir dist/
      - ./public/avatares:/app/public/avatares
      - ./prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence_network
    command: sh -c "npx prisma db push --accept-data-loss && node dist/index.js"


  # ==========================================================================
  # CONTENEDOR 3: FRONTEND (React + Vite)   ← NUEVO
  # ==========================================================================
  # Este contenedor ejecuta el servidor de desarrollo de Vite.
  # Sirve la aplicación React en el puerto 5173.
  frontend:
    # Construye la imagen usando el Dockerfile que está dentro de frontend/
    build:
      context: ./frontend    # Carpeta donde está el código React
      dockerfile: Dockerfile # Dockerfile que creamos en frontend/
    container_name: transcendence_frontend
    restart: always
    ports:
      # Puerto 5173: donde se accede al frontend → http://localhost:5173
      - "5173:5173"
    volumes:
      # Sincronizar código para hot reload (los cambios se ven al instante)
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      # Excluir node_modules del host (usa los del contenedor)
      - /app/node_modules
    networks:
      - transcendence_network
    # El frontend no depende del backend para arrancar, pero en uso real
    # necesita que el backend esté corriendo para hacer peticiones
    depends_on:
      - backend


# ============================================================================
# VOLÚMENES (PERSISTENCIA DE DATOS)
# ============================================================================
volumes:
  postgres_data:
    driver: local


# ============================================================================
# REDES (COMUNICACIÓN ENTRE CONTENEDORES)
# ============================================================================
networks:
  transcendence_network:
    driver: bridge
