services:
  web:
    image: nginx
    build:
      context: ./nginx
    ports:
      - "8889:443"
    networks:
      - transcendence_nginx_network

  game-back:
    container_name: game-back
    build:
      context: ./game/back
    networks:
      - transcendence_nginx_network
    environment:
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    networks:
      - transcendence_nginx_network

  # Users/Auth database
  db:
    image: postgres:16-alpine
    container_name: transcendence_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Users/Auth backend
  backend:
    build:
      context: ./users/
      dockerfile: Dockerfile
    container_name: transcendence_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      FORTY_TWO_CLIENT_ID: ${FORTY_TWO_CLIENT_ID}
      FORTY_TWO_CLIENT_SECRET: ${FORTY_TWO_CLIENT_SECRET}
      FORTY_TWO_REDIRECT_URI: ${FORTY_TWO_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - avatars_data:/app/public/avatars
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence_network
      - transcendence_nginx_network

  # Dedicated chat database. It is independent from the Users/Auth database.
  chat-db:
    image: postgres:16-alpine
    container_name: transcendence_chat_db
    restart: always
    environment:
      POSTGRES_USER: ${CHAT_POSTGRES_USER:-chat_user}
      POSTGRES_PASSWORD: ${CHAT_POSTGRES_PASSWORD:-chat_password}
      POSTGRES_DB: ${CHAT_POSTGRES_DB:-chat_db}
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Social chat backend
  social-chat-back:
    container_name: social-chat-back
    build:
      context: ./social-chat/back
    restart: always
    environment:
      PORT: 8890
      DATABASE_URL: "postgresql://${CHAT_POSTGRES_USER:-chat_user}:${CHAT_POSTGRES_PASSWORD:-chat_password}@chat-db:5432/${CHAT_POSTGRES_DB:-chat_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      USERS_INTERNAL_URL: http://backend:3000
    depends_on:
      chat-db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - transcendence_network
      - transcendence_nginx_network

networks:
  game_network:
    name: game_network
  auth_network:
    name: auth_network
  transcendence_network:
    name: transcendence_network
  transcendence_nginx_network:
    name: transcendence_nginx_network

volumes:
  postgres_data:
    driver: local
  chat_postgres_data:
    driver: local
  avatars_data:
    driver: local
