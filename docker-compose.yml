services:
  game-back:
    container_name: game-back
    build:
      context: ./game/back
    env_file:
      - .env.scoreback
    networks:
      - game_network
    ports:
      - "8888:8888"

  game-front:
    container_name: game-front
    build:
      context: ./game/front
    networks:
      - game_network
    ports:
      - "7777:3000"

  score_database:
    image: postgres:16-alpine
    container_name: score_database
    restart: always
    env_file:
      - .env.db
  
    volumes:
      - score_data:/var/lib/postgresql/data
    
    networks:
      - score_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  score_backend:
    build:
      context: ./scores
  
    container_name: scores
    
    restart: always

    env_file:
      - .env.scoreback
    
    depends_on:
      score_database:
        condition: service_healthy

    networks:
      -  game_network
      -  score_network

volumes:
  score_data: {}

networks:
  game_network:
    name: game_network
    driver: bridge
  score_network:
    name: score_network
    driver: bridge